<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como Funciona - Capas Personalizadas | Detecte seu celular</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cor-principal: #1DDEC6;
      --cor-secundaria: #0a1828;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: var(--cor-secundaria);
      margin-bottom: 12px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 16px;
    }
    .cta-detect {
      display: inline-block;
      background: linear-gradient(135deg, var(--cor-principal), #17b3a0);
      color: #fff;
      padding: 16px 36px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 17px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(29, 222, 198, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta-detect:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(29, 222, 198, 0.45);
    }
    .detected-info {
      margin-top: 32px;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      display: none;
    }
    .detected-info.visible { display: block; }
    .detected-info h3 { font-size: 14px; color: #888; margin-bottom: 8px; }
    .detected-info .device-name { font-size: 20px; font-weight: 600; color: var(--cor-principal); }
    .detected-info .device-meta { font-size: 13px; color: #666; margin-top: 8px; }
    .detected-info .device-extra { font-size: 12px; color: #999; margin-top: 12px; line-height: 1.5; }
  </style>
</head>

<body>
  <div class="page">
    <h1>Encontre a capa ideal para seu celular</h1>
    <p class="subtitle">Detectamos automaticamente o modelo do seu aparelho e sugerimos as capas compatíveis.</p>

    <button type="button" class="cta-detect" id="btnDetectar">
      Detectar meu celular
    </button>

    <div class="detected-info" id="detectedInfo">
      <h3>Dispositivo detectado:</h3>
      <p class="device-name" id="deviceName"></p>
      <p class="device-meta" id="deviceMeta"></p>
      <p class="device-extra" id="deviceExtra"></p>
    </div>
  </div>

  <script src="device-detector/detector.js"></script>
  <script>
    (function() {
      const btn = document.getElementById('btnDetectar');
      const detectedInfo = document.getElementById('detectedInfo');
      const deviceName = document.getElementById('deviceName');
      const deviceMeta = document.getElementById('deviceMeta');
      const deviceExtra = document.getElementById('deviceExtra');

      btn.addEventListener('click', async function() {
        btn.disabled = true;
        btn.textContent = 'Detectando...';
        detectedInfo.classList.remove('visible');

        try {
          const device = await DeviceDetector.detect();
          deviceName.textContent = (device.brand ? device.brand + ' ' : '') + device.model;
          deviceMeta.textContent = (device.os ? device.os + ' • ' : '') + 'Confiança: ' + Math.round((device.confidence || 0) * 100) + '%';

          const extra = [];
          if (device.gpu && device.gpu !== 'unknown') extra.push('GPU: ' + device.gpu);
          if (device.screen) extra.push(device.screen.width + '×' + device.screen.height + ' @ ' + device.screen.pixelRatio + 'x');
          if (device.memory !== 'unknown') extra.push(device.memory + ' GB RAM');
          if (device.cores !== 'unknown') extra.push(device.cores + ' núcleos');
          deviceExtra.textContent = extra.length ? extra.join(' • ') : '';

          detectedInfo.classList.add('visible');
        } catch (e) {
          deviceName.textContent = 'Não foi possível detectar.';
          deviceMeta.textContent = '';
          deviceExtra.textContent = '';
          detectedInfo.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = 'Detectar meu celular';
      });
    })();
  </script>
</body>

</html>
