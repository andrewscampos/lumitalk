<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como Funciona - Capas Personalizadas | Detecte seu celular</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cor-principal: #1DDEC6;
      --cor-secundaria: #0a1828;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: var(--cor-secundaria);
      margin-bottom: 12px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 16px;
    }
    .cta-detect {
      display: inline-block;
      background: linear-gradient(135deg, var(--cor-principal), #17b3a0);
      color: #fff;
      padding: 16px 36px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 17px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(29, 222, 198, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta-detect:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(29, 222, 198, 0.45);
    }
    .detected-info {
      margin-top: 32px;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      display: none;
    }
    .detected-info.visible { display: block; }
    .detected-info h3 { font-size: 14px; color: #888; margin-bottom: 8px; }
    .detected-info .device-name { font-size: 20px; font-weight: 600; color: var(--cor-principal); margin-bottom: 16px; }
    .detected-info .info-list {
      text-align: left;
      list-style: none;
      font-size: 13px;
      color: #444;
      line-height: 1.8;
    }
    .detected-info .info-list li {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .detected-info .info-list li:last-child { border-bottom: none; }
    .detected-info .info-list .info-key {
      font-weight: 600;
      color: #666;
      min-width: 120px;
    }
    .detected-info .info-list .info-val {
      word-break: break-all;
      flex: 1;
    }
    .detected-info .info-list .info-val.raw {
      font-size: 11px;
      color: #888;
      max-height: 80px;
      overflow-y: auto;
    }
    .detected-info .copy-wrap { margin-top: 20px; }
    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid var(--cor-principal);
      background: #fff;
      color: var(--cor-principal);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-copy:hover {
      background: var(--cor-principal);
      color: #fff;
    }
    .btn-copy:active { transform: scale(0.98); }
    .btn-copy.copied {
      border-color: #28a745;
      background: #28a745;
      color: #fff;
    }
    .btn-copy svg { width: 18px; height: 18px; flex-shrink: 0; }

    @media (max-width: 600px) {
      body { padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
      .page { max-width: 100%; }
      h1 { font-size: 22px; line-height: 1.3; }
      .subtitle { font-size: 15px; margin-bottom: 28px; }
      .cta-detect {
        width: 100%;
        max-width: 320px;
        padding: 14px 24px;
        font-size: 16px;
      }
      .detected-info {
        margin-top: 24px;
        padding: 20px 16px;
        border-radius: 16px;
      }
      .detected-info .device-name { font-size: 18px; word-break: break-word; }
      .detected-info .info-list { font-size: 12px; }
      .detected-info .info-list .info-key { min-width: 100px; }
      .btn-copy {
        width: 100%;
        justify-content: center;
        padding: 14px 20px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Encontre a capa ideal para seu celular</h1>
    <p class="subtitle">Detectamos automaticamente o modelo do seu aparelho e sugerimos as capas compatíveis.</p>

    <button type="button" class="cta-detect" id="btnDetectar">
      Detectar meu celular
    </button>

    <div class="detected-info" id="detectedInfo">
      <h3>Dispositivo detectado:</h3>
      <p class="device-name" id="deviceName"></p>
      <ul class="info-list" id="infoList"></ul>
      <div class="copy-wrap">
        <button type="button" class="btn-copy" id="btnCopiar" aria-label="Copiar resultado">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          Copiar resultado
        </button>
      </div>
    </div>
  </div>

  <script src="device-detector/detector.js"></script>
  <script>
    (function() {
      const btn = document.getElementById('btnDetectar');
      const btnCopiar = document.getElementById('btnCopiar');
      const detectedInfo = document.getElementById('detectedInfo');
      const deviceName = document.getElementById('deviceName');
      const infoList = document.getElementById('infoList');

      let lastDevice = null;

      function buildCopyText() {
        if (!lastDevice) {
          const parts = [];
          if (deviceName.textContent) parts.push('Modelo: ' + deviceName.textContent);
          infoList.querySelectorAll('li').forEach(function(li) {
            const k = li.querySelector('.info-key');
            const v = li.querySelector('.info-val');
            if (k && v) parts.push(k.textContent.trim() + ' ' + v.textContent.trim());
          });
          return parts.join('\n');
        }
        const d = lastDevice;
        const lines = [
          'Modelo: ' + (d.brand ? d.brand + ' ' : '') + d.model,
          'Código: ' + (d.model_code || '-'),
          'Sistema: ' + (d.os || '-'),
          'Confiança: ' + Math.round((d.confidence || 0) * 100) + '%',
          'Tela: ' + (d.screen ? d.screen.width + ' × ' + d.screen.height + ' (ratio ' + (d.screen.pixelRatio || d.screen.ratio) + 'x)' : '-'),
          'GPU: ' + (d.gpu || '-'),
          'RAM: ' + (d.memory !== undefined && d.memory !== 'unknown' ? d.memory + ' GB' : '-'),
          'Núcleos: ' + (d.cores !== undefined && d.cores !== 'unknown' ? d.cores : '-'),
          'User-Agent: ' + (d.raw || '')
        ];
        return lines.join('\n');
      }

      btnCopiar.addEventListener('click', function() {
        const text = buildCopyText();
        if (!text) return;

        navigator.clipboard.writeText(text).then(function() {
          const label = btnCopiar.querySelector('svg')?.nextSibling;
          const originalText = btnCopiar.textContent.trim();
          btnCopiar.classList.add('copied');
          btnCopiar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg> Copiado!';
          setTimeout(function() {
            btnCopiar.classList.remove('copied');
            btnCopiar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg> Copiar resultado';
          }, 2000);
        }).catch(function() {
          btnCopiar.textContent = 'Erro ao copiar';
          setTimeout(function() {
            btnCopiar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg> Copiar resultado';
          }, 2000);
        });
      });

      function renderInfoList(device) {
        const screen = device.screen || {};
        const ratio = screen.pixelRatio != null ? screen.pixelRatio : screen.ratio;
        const items = [
          { key: 'Marca', val: device.brand || '-' },
          { key: 'Modelo', val: device.model || '-' },
          { key: 'Código (model_code)', val: device.model_code || '-' },
          { key: 'Sistema (OS)', val: device.os || '-' },
          { key: 'Confiança', val: Math.round((device.confidence || 0) * 100) + '%' },
          { key: 'Largura tela', val: screen.width != null ? screen.width + ' px' : '-' },
          { key: 'Altura tela', val: screen.height != null ? screen.height + ' px' : '-' },
          { key: 'Pixel ratio', val: ratio != null ? ratio + 'x' : '-' },
          { key: 'GPU', val: device.gpu || '-' },
          { key: 'Memória (RAM)', val: device.memory !== undefined && device.memory !== 'unknown' ? device.memory + ' GB' : '-' },
          { key: 'Núcleos (CPU)', val: device.cores !== undefined && device.cores !== 'unknown' ? device.cores : '-' },
          { key: 'User-Agent', val: device.raw || '-', raw: true }
        ];
        infoList.innerHTML = items.map(function(item) {
          return '<li><span class="info-key">' + item.key + ':</span><span class="info-val' + (item.raw ? ' raw' : '') + '">' + (item.val || '-') + '</span></li>';
        }).join('');
      }

      btn.addEventListener('click', async function() {
        btn.disabled = true;
        btn.textContent = 'Detectando...';
        detectedInfo.classList.remove('visible');

        try {
          const device = await DeviceDetector.detect();
          lastDevice = device;
          deviceName.textContent = (device.brand ? device.brand + ' ' : '') + device.model;
          renderInfoList(device);
          detectedInfo.classList.add('visible');
        } catch (e) {
          lastDevice = null;
          deviceName.textContent = 'Não foi possível detectar.';
          infoList.innerHTML = '<li><span class="info-key">Erro:</span><span class="info-val">' + (e.message || 'Erro desconhecido') + '</span></li>';
          detectedInfo.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = 'Detectar meu celular';
      });
    })();
  </script>
</body>

</html>
